name: Generar APK Estado Celular

on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          unzip -q "$(find . -maxdepth 1 -name '*.zip' -print -quit)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear APK
        run: gradle --no-daemon -p EstadoCelular :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EstadoCelular-APK
          path: EstadoCelular/app/build/outputs/apk/debug/app-debug.apk
